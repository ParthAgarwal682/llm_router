# Maps classifier tiers → registry model names (src/models/registry.py).
# Swap models here without touching Python code.

tiers:
  simple: llama_8b
  moderate: gpt4o_mini
  # llama_70b is more reliable/cheaper for long batches than claude_sonnet_4
  # (Sonnet can hang or 402 on low OpenRouter credit / high max_tokens)
  complex: llama_70b

# Phase 3 — cheap single-judge verifier
# Registry names; OpenRouter IDs verified 2026-07-27:
#   gpt4o      → openai/gpt-4o
#   gpt4o_mini → openai/gpt-4o-mini
verification:
  strong_model: gpt4o_mini
  judge_model: gpt4o_mini

# Phase 4 — multi-critic arbitration (different models per critic)
# Prefer mid/cheap models so OpenRouter credit checks on max_tokens stay affordable.
# Verified OpenRouter IDs (2026-07-27):
#   gpt4o_mini     → openai/gpt-4o-mini
#   claude_haiku   → anthropic/claude-3-haiku
#   llama_70b      → meta-llama/llama-3.3-70b-instruct
#   gpt4o          → openai/gpt-4o  (adjudicator)
arbitration:
  critics:
    accuracy: gpt4o_mini
    logic: claude_haiku
    completeness: llama_70b
  adjudicator_model: gpt4o_mini
